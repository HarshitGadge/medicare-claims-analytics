name: medicare_claims
version: "1.0.0"
config-version: 2
profile: medicare

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Folder holding the DE-SynPUF CSVs, relative to where dbt is run (the repo root).
  # CI points this at data/sample (a 1% member sample committed to the repo).
  raw_dir: "data/raw"
  # Last day with claims in DE-SynPUF. Index stays need 30 days of follow-up before it.
  data_end_date: "2010-12-31"

models:
  medicare_claims:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  medicare_claims:
    +column_types:
      ssa_state_code: varchar

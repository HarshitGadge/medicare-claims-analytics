name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: dbt build on the 1% sample (models, data tests, unit tests)
        run: >
          dbt build --project-dir dbt --profiles-dir dbt
          --vars '{raw_dir: data/sample, ip_reconciliation_tolerance: 0.10}'
        env:
          DUCKDB_PATH: sample.duckdb
      - name: pytest (exports + Streamlit app smoke test)
        run: pytest -q tests
